<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover">
  <title>Welcome - Akademi Abang Rumah</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
  <link rel="icon" href="assets/images/akademilogov2.png" type="image/png">
</head>

<body class="min-h-screen bg-gray-50 flex flex-col justify-between font-sans">
 
  <!-- Simple Header -->
  <header class="bg-[#4a7425] text-white p-1 flex items-center shadow-md z-50">
    <span class="text-lg font-bold tracking-wide mx-4">AKADEMI ABANG RUMAH</span>
    <a href="/about.html" class="ms-auto">
      <img src="assets/images/akademilogov2.png" alt="Akademi Abang Rumah Logo" class="p-2 w-22 h-auto">
    </a>
  </header>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" class="bg-[#4a7425] text-white px-4 py-3 shadow-md" hidden>
          <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
            <div class="flex items-center gap-3">
              <!-- Big friendly icon -->
              <span class="text-2xl">📱</span>
              <p class="font-medium text-base sm:text-lg">
                Muat turun aplikasi **Akademi Abang Rumah** untuk akses mudah dan pantas!
              </p>
            </div>
            <div class="flex gap-2 shrink-0">
              <button id="pwa-accept-btn" class="bg-white text-emerald-800 font-bold px-5 py-2 rounded-lg text-sm shadow hover:bg-emerald-50 transition">
                Pasang Sekarang (Install)
              </button>
              <button id="pwa-close-btn" class="text-white opacity-80 hover:opacity-100 text-sm px-2 py-2">
                Nanti Saja
              </button>
            </div>
          </div>
  </div>

  <!-- Hero Welcome Content -->
  <main class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-2xl mx-auto">
    <a href="/premium_access/classroom.html" class="inline-block bg-[#4a7425] text-white font-semibold text-lg px-8 py-4 rounded-xl shadow-lg hover:bg-[#4a7425] transition-all transform hover:-translate-y-1 active:translate-y-0 w-full sm:w-auto mb-6">
        <img src="/assets/images/welcome_image.jpg" alt="Mula Belajar Sekarang!" class="w-full max-w-md mb-4 mt-4 rounded-lg shadow-lg">
    </a>

     <!-- PWA Download Button
        <button id="pwa-install-btn" class="absolute top-4 left-4 bg-[#4a7425] text-white font-semibold text-sm px-4 py-2 mt-2 rounded-lg shadow-lg hover:bg-[#4a7425] active:bg-[#6bb52a] transition-all transform hover:-translate-y-1 active:translate-y-0 border-solid" hidden>
          Pasang Aplikasi
        </button> -->
        
  </main>

  <!-- Simple Footer -->
  <footer class="bg-gray-100 text-gray-500 text-sm p-4 text-center border-t">
    &copy; 2026 Akademi Abang Rumah. Hak Cipta Terpelihara.
  </footer>
  <script type="module" src="public/premium_access/main.js"></script>
</body>
</html>
