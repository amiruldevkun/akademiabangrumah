<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kerja Piling - Akademi Abang Rumah</title>
  <link rel="stylesheet" href="../output.css">
</head>
<body class="min-h-screen bg-white flex flex-col font-sans overflow-x-hidden">

  <!-- TOP NAVBAR -->
  <header class="bg-[#4a7425] text-white p-4 flex items-center shadow-md z-50">
    <button id="menu-btn" class="text-2xl mr-4 focus:outline-none">☰</button>
    <span class="text-lg font-bold tracking-wide">AKADEMI ABANG RUMAH</span>
    <img src="../assets/images/ayjo ventures logo.png" alt="Akademi Abang Rumah Logo" class="ms-auto mt-2 w-24 h-auto">
  </header>

  <!-- MAIN CONTAINER -->
  <div class="flex flex-1 relative">
    
    <!-- SYLLABUS SIDEBAR (Hidden everywhere by default) -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-[#4a7425] text-white pt-28 p-4 z-40 transform -translate-x-full transition-all duration-300 ease-in-out shadow-2xl">
      <div class="space-y-6">
        
        <!-- Topic 1 -->
        <div class="space-y-2">
            <a href="topic1.html" class="bg-white text-black font-semibold px-3 py-1.5 rounded text-center shadow-sm block">BAHAN-BAHAN PEMBINAAN</a>
        </div>

        <!-- Topic 2 -->
        <div class="space-y-2">
          <div class="bg-white text-black font-semibold px-3 py-1.5 rounded text-center shadow-sm">KERJA PILING</div>
          <ul class="pl-2 space-y-1 text-sm text-slate-200">
            <li class="lesson-item cursor-pointer hover:text-white p-1 rounded transform transition-all duration-200 hover:translate-y-0.5 hover:shadow-md active:translate-y-0 active:shadow-sm" data-lesson="Piling Menggunakan 4x4x10" data-video="https://www.youtube.com/embed/KoyYZeH6QDs?si=kibKSK05RZuUcfS0">Piling Menggunakan 4x4x10</li>
            <li class="lesson-item cursor-pointer hover:text-white p-1 rounded transform transition-all duration-200 hover:translate-y-0.5 hover:shadow-md active:translate-y-0 active:shadow-sm" data-lesson="Teknik Memotong Papan Acuan 16 inci" data-video="https://www.youtube.com/embed/VclEsgM-zqU?si=WMz5YK8m1nQgbzbh">Teknik Memotong Papan Acuan 16 inci</li>
          </ul>
        </div>

        <!-- Topic 3 -->
        <div class="space-y-2">
          <a href="topic3.html" class="bg-white text-black font-semibold px-3 py-1.5 rounded text-center shadow-sm block">KERJA ACUAN DAN TUANG KONKRIT ASAS</a>
        </div>

      </div>
    </aside>

    <!-- MAIN CANVAS -->
    <main class="flex-1 p-4 lg:p-8 bg-gray-50 transition-all duration-300">
      <div class="max-w-4xl mx-auto">
        <!-- Active Lesson Title -->
        <h1 id="lesson-title" class="text-3xl font-bold text-gray-800 mb-6 text-center lg:text-left">
          
        </h1>
        
        <!-- Responsive Video Container Player Using HTML iframe -->
        <div class="aspect-video w-full bg-black rounded-lg shadow-inner overflow-hidden">
          <iframe id="video-player" class="w-full h-full" src="https://www.youtube.com/embed/F5nOQ2QpIMo?si=6ZanFpsxSGsbpqe_" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <p class="lg:hidden block sm:hidden text-center text-sm text-gray-500 mb-2 pt-10">
          Tip: Putarkan peranti secara melintang untuk melihat video dengan lebih baik.
        </p>

      </div>
    </main>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const lessonTitle = document.getElementById('lesson-title');
    const videoPlayer = document.getElementById('video-player');
    const lessonItems = document.querySelectorAll('.lesson-item');

    // 1. Toggle Sidebar Sliding Mechanics smoothly
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevents instant closing triggers
      sidebar.classList.toggle('-translate-x-full');
    });

    // 2. Handle Lesson Selection & Auto-Hide Panel
    lessonItems.forEach(item => {
      item.addEventListener('click', (e) => {
        const targetLesson = e.target.getAttribute('data-lesson');
        const targetVideo = e.target.getAttribute('data-video');

        lessonTitle.textContent = targetLesson;
        videoPlayer.src = targetVideo;
        
        lessonItems.forEach(i => i.classList.remove('bg-blue-800', 'text-white'));
        e.target.classList.add('bg-blue-800', 'text-white');

        // Slide the sidebar back out of frame smoothly after selecting a module
        sidebar.classList.add('-translate-x-full');
      });
    });

    // 3. Optional: Close sidebar if user clicks outside of it on the main content canvas
    document.addEventListener('click', (e) => {
      if (!sidebar.contains(e.target) && e.target !== menuBtn) {
        sidebar.classList.add('-translate-x-full');
      }
    });
  </script>
</body>
</html>
